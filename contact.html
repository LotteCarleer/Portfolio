<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Contact | Lotte Carleer</title>

  <meta
    name="description"
    content="Neem contact op met Lotte Carleer, Digital Experience Designer."
  >

  <meta name="author" content="Lotte Carleer">
  <meta name="robots" content="index, follow">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- =========================
       HEADER
  ========================== -->

  <header class="site-header">

    <nav class="nav container" aria-label="Hoofdnavigatie">

      <a class="logo" href="index.html">
        Lotte Carleer
      </a>

      <div class="nav-links">

        <a href="index.html">
          Home
        </a>

        <a href="projects.html">
          Werk
        </a>

        <a href="about.html">
          Over mij
        </a>

        <a class="active" href="contact.html">
          Contact
        </a>

      </div>

    </nav>

  </header>


  <!-- =========================
       CONTACT
  ========================== -->

  <main class="contact-page">

    <section class="contact-section container">

      <div class="contact-card">

        <!-- Zwaaiend handje -->

        <span class="waving-hand" aria-hidden="true">
          👋
        </span>


        <!-- Titel -->

        <h1>
          Zeg <span>hallo!</span>
        </h1>


        <!-- Intro -->

        <p class="contact-intro">
          Heb je een project, een vraag of wil je gewoon
          kennismaken?<br>
          Kies waarvoor het gaat en stuur me een mailtje.
        </p>


        <!-- Keuzes -->

        <div class="contact-options">

          <button
            class="contact-option active"
            type="button"
            data-subject="Nieuw project"
          >
            Nieuw project
          </button>

          <button
            class="contact-option"
            type="button"
            data-subject="Samenwerking"
          >
            Samenwerking
          </button>

          <button
            class="contact-option"
            type="button"
            data-subject="Een vraag"
          >
            Een vraag
          </button>

          <button
            class="contact-option"
            type="button"
            data-subject="Gewoon hallo"
          >
            Gewoon hallo
          </button>

        </div>


        <!-- Mail knop -->

        <a
          id="mail-button"
          class="mail-button"
          href="mailto:lottecarleer@gmail.com?subject=Nieuw%20project"
        >
          Mail me →
        </a>


        <!-- Email -->

        <p class="contact-email">
          lottecarleer@gmail.com
          <span>·</span>
          Ik reageer zo snel mogelijk.
        </p>

      </div>

    </section>

  </main>


  <!-- =========================
       FOOTER
  ========================== -->

  <footer class="footer">

    <div class="container">

      <p>
        © 2026 Lotte Carleer
      </p>

      <p>
        Designed &amp; built by Lotte
      </p>

    </div>

  </footer>


  <!-- =========================
       JAVASCRIPT
  ========================== -->

  <script>

    const options =
      document.querySelectorAll(".contact-option");

    const mailButton =
      document.querySelector("#mail-button");


    options.forEach((option) => {

      option.addEventListener("click", () => {

        // Actieve knop veranderen

        options.forEach((item) => {
          item.classList.remove("active");
        });

        option.classList.add("active");


        // Onderwerp van de mail aanpassen

        const subject =
          option.dataset.subject;

        mailButton.href =
          `mailto:lottecarleer@gmail.com?subject=${encodeURIComponent(subject)}`;

      });

    });

  </script>

</body>
</html>
